defaults:
  - model: midi
  - dataset: lakh-midi
  - logger: wandb
  - _self_

experiment_name: base
seed: 42

trainer:
  _target_: lightning.Trainer
  logger: ${logger}
  deterministic: true
  max_epochs: 10
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint # periodic checkpoints
      dirpath: ${paths.checkpoints_dir}
      filename: periodic-epoch={epoch}-val_loss={val/loss:.2f}
      auto_insert_metric_name: false
      save_last: true
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint # best checkpoints
      dirpath: ${paths.checkpoints_dir}
      filename: best-epoch={epoch}-val_loss={val/loss:.2f}
      auto_insert_metric_name: false
      save_top_k: 3
      monitor: val/loss
      mode: min
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch
      log_momentum: true
    - _target_: lightning.pytorch.callbacks.BatchSizeFinder # might need to comment this out for predictions
#    - _target_: lightning.pytorch.callbacks.DeviceStatsMonitor # logs quite a lot of data

paths:
  # path to root directory
  # this requires PROJECT_ROOT environment variable to exist
  # you can replace it with "." if you want the root to be the current working directory
  root_dir: "." # ${oc.env:PROJECT_ROOT:.}

  # path to data directory
  data_dir: ${paths.root_dir}/data/

  # path to output directory, created dynamically by hydra
  # path generation pattern is specified in `configs/hydra/default.yaml`
  # use it to store all files generated during the run, like ckpts and metrics
  output_dir: ${hydra:runtime.output_dir}

  # path to working directory
  work_dir: ${hydra:runtime.cwd}

  # checkpoint directory
  checkpoints_dir: ${paths.output_dir}/checkpoints/

# external libraries in "src/libs" added to path for import
libs:
  - "schmubert"