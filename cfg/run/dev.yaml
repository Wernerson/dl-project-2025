# @package _global_
# overrides for local runs

trainer:
  #  fast_dev_run: true
  max_epochs: 1
  limit_train_batches: 5
  limit_val_batches: 1
  limit_test_batches: 1
  callbacks:
    # Best Checkpoint
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${paths.checkpoints_dir}
      filename: best
      auto_insert_metric_name: false
      save_top_k: 1
      monitor: val/loss
      mode: min
    # Generation
    - _target_: callbacks.generation.SampleGeneration
      converter: ${evaluator.converter}
      sample_dir: ${paths.sample_dir}
      num_samples: 3
      seq_len: ${dataset.max_seq_len}
logger:
  offline: true
  log_model: false
dataset:
  batch_size: 16
  download_url: https://polybox.ethz.ch/index.php/s/MnQDB4opQdR7nat/download/lakh-midi-1k.tar.gz
evaluator:
  num_samples: 5

hydra:
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}