# @package _global_

defaults:
  - override /dataset: miditok_full
  - override /model: musicbert_diffusion_full

experiment_name: musicbert_full_dim_run

# Dataset overrides to match your MidiTok config
dataset:
  batch_size: 1024
  # This should match the sequence length your model expects
  max_seq_len: 128 

# Model overrides for a lighter/faster dev run
model:
  net:
    num_layers: 4 
    hidden_dim: 128